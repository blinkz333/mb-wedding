  <!-- ── Heart ── -->
  <path d="M32 35 C32 32.5 29 30 27 32.5 C25 35 28 38 32 41 C36 38 39 35 37 32.5 C35 30 32 32.5 32 35 Z" fill="#C9A470" opacity="0.95"/>
